name: Screener diario

on:
  schedule:
    # Lunes a viernes 10:17 UTC = 7:17 hora de Argentina (evita la demora de las horas en punto)
    - cron: "17 10 * * 1-5"
  workflow_dispatch:   # permite correrlo a mano con el botón "Run workflow"

jobs:
  screener:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Correr screener y enviar mail
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python screener.py

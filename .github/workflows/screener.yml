name: Screener diario

on:
  schedule:
    # Lunes a viernes 05:17 UTC = 2:17 de la madrugada en Argentina. Usa el cierre del día anterior en Nueva York.
    # Se programa de madrugada para tener margen: GitHub a veces atrasa las tareas programadas varias horas,
    # y así el mail igual llega antes de que abra BYMA (11:00).
    - cron: "17 5 * * 1-5"
  workflow_dispatch:   # permite correrlo a mano con el botón "Run workflow"

jobs:
  screener:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Correr screener y enviar mail
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python screener.py

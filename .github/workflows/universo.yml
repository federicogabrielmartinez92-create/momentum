name: Universo de CEDEARs

on:
  schedule:
    # Día 27 de cada mes a las 09:41 UTC (6:41 Argentina): antes del momentum (día 1) y de la cartera de calidad (día 15).
    - cron: "41 9 27 * *"
  workflow_dispatch:

permissions:
  contents: write     # para guardar universo.csv

jobs:
  universo:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Revisar el listado de BYMA contra Yahoo y la SEC
        env:
          CALIDAD_SEC_AGENTE: ${{ vars.CALIDAD_SEC_AGENTE }}
        run: python universo.py actualizar
      - name: Guardar universo.csv
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add universo.csv
          git diff --staged --quiet || (git commit -m "Universo de CEDEARs: actualización $(date +%F) [skip ci]" && git pull --rebase && git push)

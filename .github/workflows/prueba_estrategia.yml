name: Prueba de estrategia

# Backtests de prueba, aparte de la app. Corre solo al subir cambios a una rama que empiece con "prueba-".
on:
  push:
    branches: ["prueba-*"]

jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python herramientas/prueba_donchian.py
      - uses: actions/upload-artifact@v4
        with:
          name: resultado
          path: resultado_donchian.json

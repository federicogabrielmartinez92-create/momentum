name: Prueba de estrategia

# Backtests de prueba, aparte de la app. Corre solo al subir cambios a una rama que empiece con "prueba-".
on:
  push:
    branches: ["prueba-*"]

permissions:
  contents: write

jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Backtest de calidad normal (no toca la app)
        env:
          CALIDAD_SEC_AGENTE: ${{ vars.CALIDAD_SEC_AGENTE }}
          BT_ESTADO_SALIDA: /tmp/estado_a.json
        run: python backtest_calidad.py && cp historial_calidad.json resultado_calidad_con_nvda.json
      - name: Backtest de calidad sin NVIDIA
        env:
          CALIDAD_SEC_AGENTE: ${{ vars.CALIDAD_SEC_AGENTE }}
          BT_ESTADO_SALIDA: /tmp/estado_b.json
          CALIDAD_EXCLUIR: NVDA
        run: python backtest_calidad.py && cp historial_calidad.json resultado_calidad_sin_nvda.json
      - name: Guardar el resultado en la rama de prueba
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git checkout historial_calidad.json cartera_calidad_backtest.json 2>/dev/null || true
          git add resultado_calidad_con_nvda.json resultado_calidad_sin_nvda.json
          git commit -m "Resultado de la prueba [skip ci]" && git push

name: Prueba de estrategia

# Backtests de prueba, aparte de la app. Corre solo al subir cambios a una rama que empiece con "prueba-".
on:
  push:
    branches: ["prueba-*"]

permissions:
  contents: write

jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Backtest de calidad con serie diaria (no toca el historial)
        env:
          CALIDAD_SEC_AGENTE: ${{ vars.CALIDAD_SEC_AGENTE }}
          BT_ESTADO_SALIDA: /tmp/estado_prueba.json
          BT_INICIO: "2026-01-01"
        run: python backtest_calidad.py
      - name: Guardar el resultado en la rama de prueba
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          cp historial_calidad.json resultado_calidad_2026.json
          git add resultado_calidad_diario.json resultado_calidad_2026.json
          git commit -m "Resultado de la prueba [skip ci]" && git push

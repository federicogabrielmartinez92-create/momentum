name: Explorador del dashboard

# Actualiza los datos del explorador (métricas de calidad de todas las empresas y ranking de momentum) una vez
# por semana. No toca ninguna cartera ni manda mails.
on:
  schedule:
    - cron: "37 11 * * 0"      # domingos 08:37 Argentina
  workflow_dispatch:

permissions:
  contents: write

jobs:
  explorador:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Métricas de calidad de todo el universo
        env:
          CALIDAD_SEC_AGENTE: ${{ vars.CALIDAD_SEC_AGENTE }}
          CALIDAD_EXCLUIR: ${{ vars.CALIDAD_EXCLUIR }}
        run: python calidad.py --explorador
      - name: Ranking y cartera del momentum
        env:
          MOMENTUM_INICIO: ${{ vars.MOMENTUM_INICIO }}
          MOMENTUM_CAPITAL: ${{ vars.MOMENTUM_CAPITAL }}
          MOMENTUM_EXCLUIR: ${{ vars.MOMENTUM_EXCLUIR }}
        run: python momentum.py --solo-panel
      - name: Guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          for f in explorador_calidad.json panel_momentum.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          git diff --staged --quiet || (git commit -m "Explorador: datos $(date +%F) [skip ci]" && git pull --rebase && git push)

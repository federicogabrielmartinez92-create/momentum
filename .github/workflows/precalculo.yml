name: Precálculo del dashboard

# Deja hechos los cálculos pesados de la app (momentum, reversión y nivel de cada acción) para que abra rápido.
# Lunes a viernes 22:37 UTC (19:37 Argentina), después del cierre de Nueva York. No manda mails ni toca carteras.
on:
  schedule:
    - cron: "37 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  precalculo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Calcular
        env:
          MOMENTUM_INICIO: ${{ vars.MOMENTUM_INICIO }}
          MOMENTUM_EXCLUIR: ${{ vars.MOMENTUM_EXCLUIR }}
        run: python precalculo.py
      - name: Guardar
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          if [ -d precalculo ]; then git add precalculo; fi
          git diff --staged --quiet || (git commit -m "Precálculo del dashboard $(date +%F) [skip ci]" && git pull --rebase && git push)

name: Comparar reversión (temporal)
on:
  push:
    branches: [comparar-reversion]
    paths-ignore: ["tmp_comparar/salida.txt"]
permissions:
  contents: write
jobs:
  comparar:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -u tmp_comparar/comparar_reversion.py > tmp_comparar/salida.txt 2>&1 || true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add tmp_comparar/salida.txt && git commit -m "salida [skip ci]" && git push

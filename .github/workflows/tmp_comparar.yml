name: Comparar reversión (temporal)
on:
  push:
    branches: [comparar-reversion]
jobs:
  comparar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tmp_comparar/comparar_reversion.py
